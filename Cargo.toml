[workspace]
resolver = "3"

members = [
    "crates/core",
    "crates/engine",
    "crates/render",
    "crates/world",
    "crates/audio",
    "crates/physics",
    "crates/input",
    "crates/assets",
    "crates/net",
    "crates/ui",
    "crates/game",
    "crates/app",
    "crates/world_editor",
]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
thiserror = "2"
anyhow = "1"
bytemuck = { version = "1", features = ["derive"] }
noise = "0.9"
glam = "0.30"
bevy_ecs = "0.18"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
