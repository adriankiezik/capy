[workspace]
resolver = "3"

members = [
    "crates/core",
    "crates/engine",
    "crates/render",
    "crates/audio",
    "crates/physics",
    "crates/input",
    "crates/assets",
    "crates/net",
    "crates/ui",
    "crates/game",
    "crates/app",
]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
thiserror = "2"
anyhow = "1"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
