[workspace]
resolver = "3"

members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
thiserror = "2"
anyhow = "1"
bytemuck = { version = "1", features = ["derive"] }
glam = "0.30"
bevy_ecs = "0.18"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
lz4_flex = "0.11"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
egui = "0.33"
egui-winit = "0.33"
egui-wgpu = "0.33"
# Locked to wgpu 27 until egui-wgpu updates its compatibility.
wgpu = "27"
winit = "0.30.13"
raw-window-handle = "0.6"
pollster = "0.4"
fbxcel-dom = "0.0.10"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "tga", "bmp"] }

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"

# Optimize workspace crates even in debug builds so the voxel pipeline
# (67M-voxel mip scan, tree build, DAG reduction) doesn't take 30+ seconds.
[profile.dev]
opt-level = 1

# Keep heavy third-party crates optimized in debug builds.
[profile.dev.package."*"]
opt-level = 2
